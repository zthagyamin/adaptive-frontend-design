<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排班示例 · 开发诊断</title><link rel="stylesheet" href="./styles.css"></head><body><main class="diagnostic"><span class="demo-label">开发诊断 · 本地模拟服务</span><h1>下一次保存的服务场景</h1><p>这是独立的开发入口，普通排班页面不包含故障开关。设置作用于此服务下一次新的写入请求，随后自动回到成功。读取与已成功请求的重复重放不会消耗它。</p><form id="control"><label>模拟结果<select name="mode"><option value="success">成功 · 正常保存</option><option value="delay">延迟 · 等待 2.2 秒后保存</option><option value="fail">失败 · 不写入，保留重试机会</option><option value="conflict">冲突 · 模拟同事抢先占用时段</option></select></label><button class="primary">设置下一次请求</button></form><p id="result" role="status"></p><p><a href="./" target="_blank">打开排班工具 ↗</a></p><p>所有姓名、项目和预约均为虚构资料。没有账号、生产数据库或真实设备控制；服务重启即恢复初始一周数据。</p></main><script type="module">document.querySelector('#control').addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;try{const response=await fetch('./api/__demo/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:new FormData(event.target).get('mode'),delayMs:2200})});const data=await response.json();document.querySelector('#result').textContent=response.ok?`已设置：${data.mode}。请回到排班工具操作。`:data.message;}catch{document.querySelector('#result').textContent='无法连接演示服务。';}finally{button.disabled=false;}});</script></body></html>
