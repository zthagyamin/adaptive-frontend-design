name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate package and links
        run: node scripts/validate.mjs
      - name: Check mathematical helpers
        run: node --test tests/*.test.mjs
